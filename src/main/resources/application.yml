server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: tunebridge
  web:
    resources:
      cache:
        period: 0

tunebridge:
  apple:
    developer-token: ${APPLE_DEVELOPER_TOKEN:}
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key-path: ${APPLE_PRIVATE_KEY_PATH:}
    default-storefront: ${APPLE_STOREFRONT:cn}
  migration:
    max-tracks: 200
    batch-size: 100
    request-interval-ms: 120
  demo:
    enabled: true

logging:
  level:
    root: INFO
    com.tunebridge: INFO
